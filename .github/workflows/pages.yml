name: Docs site

# Builds the site from the latest geneviewer-js on npm and the sources in
# scripts/fetch-sources.sh. After a release of a package:
#   gh workflow run pages.yml -R nvelden/geneviewer-docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: npm ci
      - run: npm install --no-save geneviewer-js@latest
      # The gallery's thumbnails are made in the build, with Chrome
      - run: npm run build
        env:
          GENEVIEWER_CHROME: 1
      - run: npm test
        env:
          GENEVIEWER_CHROME: 1
      # The Python shown with the guide's charts gives each chart's spec
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          ref=$(sed -n 's/^PY_REF="\(.*\)"$/\1/p' scripts/fetch-sources.sh)
          pip install "geneviewer-py @ git+https://github.com/nvelden/geneviewer-py@${ref}"
          python scripts/check-python-charts.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Keeps _site/.nojekyll
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
